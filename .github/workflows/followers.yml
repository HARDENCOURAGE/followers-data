name: weekly-followers
on:
  schedule:
    - cron: '0 16 * * *'    # UTC 16:00 = 北京时间次日 00:00，每日运行
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas urllib3
      - run: python xueqiu_followers_cloud.py
      - name: Commit data
        run: |
          git config user.name "followers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ report/ raw/
          git commit -m "followers $(date +%Y%m%d)" || echo "no changes"
          git push
